services:
  mongodb:
    image: mongo:8.0
    container_name: linkedin-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    volumes:
      - mongodb_data:/data/db

    networks:
      - linkedin-network

volumes:
  mongodb_data:

networks:
  linkedin-network:
    driver: bridge